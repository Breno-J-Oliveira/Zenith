[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = { version = "2", features = ["api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "zenith_lib"
path = "src/main.rs"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
